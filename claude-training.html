<html lang="ja">
<head>
<meta charset="UTF-8">

<title>Claude仕事術講座 — 中小企業のためのAI実務活用</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{--ink:#1f2a30;--bg:#f4f7f8;--panel:#ffffff;--accent:#1a5f7a;--accent-soft:#e7f1ea;--line:#d9e2e5;--muted:#5c6b72;--warn:#c0622b;--egrid-green:#57a773;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.85}
.egrid-bar{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:12px}
.egrid-bar .eg-brand{font-weight:700;color:var(--accent);text-decoration:none;font-size:16px}
.egrid-bar .eg-brand span{color:var(--egrid-green)}
.egrid-bar .eg-tag{color:var(--muted);font-size:13px}
.egrid-bar .eg-back{margin-left:auto;color:var(--accent);text-decoration:none;font-size:13px}
.egrid-bar .eg-back:hover{text-decoration:underline}
a{color:var(--accent)}
.layout{display:flex;min-height:100vh}
nav{width:280px;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0}
.brand{font-weight:700;font-size:16px;color:var(--accent);margin-bottom:2px}
.brand-sub{font-size:11px;color:var(--muted);margin-bottom:16px}
.nav-group{margin-bottom:14px}
.nav-part{font-size:12px;font-weight:700;color:var(--muted);padding:6px 8px;letter-spacing:.05em}
.nav-item{display:block;width:100%;text-align:left;border:none;background:none;font:inherit;font-size:13px;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--ink)}
.nav-item:hover{background:var(--accent-soft)}
.nav-item.active{background:var(--accent);color:#fff}
.nav-item .done{color:var(--accent);margin-right:4px;font-weight:700}
.nav-item.active .done{color:#fff}
.progress-mini{font-size:11px;color:var(--muted);padding:0 10px 4px}
main{flex:1;padding:36px 48px;max-width:860px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:10px}
.content h1{font-size:26px;margin:0 0 18px;line-height:1.4}
.content h2{font-size:21px;margin:34px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--accent-soft)}
.content h3{font-size:16px;margin:26px 0 10px;color:var(--accent)}
.content p{margin:0 0 14px}
.content ul,.content ol{margin:0 0 14px 1.5em}
.content li{margin-bottom:6px}
.content table{border-collapse:collapse;margin:0 0 18px;width:100%;font-size:14px;background:#fff}
.content th,.content td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}
.content th{background:var(--accent-soft)}
.content blockquote{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 16px;margin:0 0 16px;border-radius:0 8px 8px 0;font-size:14px}
.content pre{background:#22302b;color:#e8f0ec;padding:14px 16px;border-radius:10px;overflow-x:auto;font-size:13px;margin:0 0 16px;line-height:1.6}
.content code{font-family:ui-monospace,Menlo,monospace}
.content p code,.content li code{background:var(--accent-soft);padding:1px 6px;border-radius:4px;font-size:.9em}
.content hr{border:none;border-top:1px solid var(--line);margin:28px 0}
.complete-bar{margin-top:36px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border:none;font:inherit;font-size:14px;padding:10px 20px;border-radius:10px;cursor:pointer}
.btn.secondary{background:var(--panel);color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.home-hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;margin-bottom:22px}
.home-hero h1{font-size:26px;margin-bottom:6px}
.home-hero p{color:var(--muted);font-size:14px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
.card h3{font-size:15px;color:var(--accent);margin-bottom:6px}
.card p{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.bar{height:8px;background:var(--accent-soft);border-radius:6px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.bar-label{font-size:11px;color:var(--muted);margin-top:5px}
.quiz-q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.quiz-q h4{font-size:14.5px;margin-bottom:10px}
.quiz-opt{display:block;padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;cursor:pointer;font-size:14px}
.quiz-opt:hover{background:var(--accent-soft)}
.quiz-opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.quiz-opt.correct{border-color:var(--accent);background:#dff1e9;font-weight:600}
.quiz-opt.wrong{border-color:var(--warn);background:#f8e8e0}
.quiz-result{font-size:18px;font-weight:700;padding:16px;border-radius:12px;background:var(--accent-soft);margin-bottom:16px}
.pill{display:inline-block;font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;margin-left:8px}
footer{font-size:11px;color:var(--muted);padding:24px 48px;border-top:1px solid var(--line)}
@media(max-width:800px){.layout{flex-direction:column}nav{width:100%;height:auto;position:static}main{padding:20px}}
</style>

<script>
const DATA = {"title": "Claude仕事術講座", "subtitle": "中小企業のためのAI実務活用", "parts": [{"id": "p1", "label": "第1部 基礎編", "theme": "AIを仕事の道具にする", "chapters": [{"title": "1-1. ClaudeというAI — 何者で、何が得意か", "md": "### この章のゴール\n\nClaudeがどんな道具で、何を任せると効果が大きいかを自分の言葉で説明できる。\n\n### Claudeとは\n\nClaudeは、米Anthropic社が開発したAIアシスタントです。文章で話しかけると、文章で答えが返ってきます。特別な操作方法を覚える必要はなく、「部下や外注先に仕事を頼むときの日本語」がそのまま使えます。\n\nポイントは、Claudeが「検索エンジン」ではなく「作業者」だということです。調べるだけでなく、書く・直す・まとめる・比べる・計算の下ごしらえをする、といった実作業を任せられます。\n\n### 得意なこと・不得意なこと\n\n**得意なこと**\n\n- 文章を書く・直す（メール、案内文、求人票、マニュアル）\n- 長い資料を短くまとめる（議事録、報告書、契約書の下読み）\n- 考えの整理に付き合う（壁打ち、選択肢の比較、リスクの洗い出し）\n- 表やデータの下ごしらえ（形式の変換、分類、たたき台の集計）\n- たたき台を素早く出す（企画案、チラシ文面、段取り表）\n\n**不得意なこと・注意が必要なこと**\n\n- 最新情報や社内事情は、こちらが渡さない限り知らない\n- それらしい間違いを自信ありげに言うことがある（後述の「ハルシネーション」）\n- 最終判断はできない。決めるのは常に人間\n\n### 中小企業でこそ効く理由\n\n大企業と違い、中小企業は「一人が何役もこなす」のが普通です。営業が見積も作り、社長が求人票も書く。Claudeは、この「本業ではないが誰かがやらねばならない仕事」の時間を大きく減らします。専任者を雇うほどではない業務ほど、AIに向いています。\n\n### まずはこの3つから\n\n1. **下書き係**：ゼロから書く仕事を「直すだけ」の仕事に変える\n2. **要約係**：読むのに30分かかる資料を3分で把握する\n3. **相談係**：一人で悩んでいたことを、話しながら整理する\n\n---"}, {"title": "1-2. 最初の30分 — 始め方と画面の見方", "md": "### この章のゴール\n\nアカウントを作り、最初の一仕事をClaudeに頼めるようになる。\n\n### 使い始める手順\n\n1. ブラウザで claude.ai を開く（スマホアプリ・パソコン用アプリもある）\n2. メールアドレスで登録する\n3. 画面下部の入力欄に、日本語で頼みごとを書いて送信する\n\n無料でも使えますが、業務で日常的に使うなら有料プランを推奨します。利用回数の上限が緩和され、長い資料の読み込みや後述の便利機能が使えます。料金・プラン内容は変わるため、契約前に公式サイトで確認してください。\n\n### 画面の基本\n\n- **入力欄**：頼みごとを書く場所。改行しながら長く書いてよい\n- **新しいチャット**：話題が変わったら新しいチャットを開く。1チャット=1案件が整理のコツ\n- **履歴**：過去のやりとりは残る。後から見返せる\n- **ファイル添付**：クリップのマークからWord・Excel・PDF・画像を渡せる\n\n### 最初の一仕事（体験）\n\n次の文をそのまま送ってみてください。\n\n> 取引先に、納期を3日延ばしてほしいとお願いするメールの下書きを作ってください。相手は長年の付き合いがある部品商社の担当者です。理由は当社の検品工程で不具合が見つかり、再検品に時間がかかるためです。誠実で、言い訳がましくない文面にしてください。\n\n30秒でたたき台が出てきます。そのまま使わず、「もう少し短く」「件名も3案ください」と続けて注文をつけてください。**会話しながら仕上げる**のがAIの正しい使い方です。\n\n### 覚えておきたい3つの操作感覚\n\n1. **やり直しは無料**：気に入らなければ何度でも注文をつける\n2. **文脈は続いている**：同じチャット内では前の話を覚えている\n3. **恥ずかしがらなくていい**：雑な頼み方でも動く。ただし次章の「型」を使うと精度が上がる\n\n---"}, {"title": "1-3. 頼み方の型 — 目的・材料・条件・形式", "md": "### この章のゴール\n\n一発で使える答えに近づく「依頼文の型」を身につける。\n\n### なぜ頼み方で結果が変わるのか\n\nClaudeはこちらの頭の中を知りません。新入社員に仕事を頼む場面を想像してください。「いい感じにやっておいて」では新人が困るのと同じで、AIも背景と条件を伝えるほど良い仕事をします。\n\n### 4点セットの型\n\n| 要素 | 伝えること | 例 |\n|---|---|---|\n| **目的** | 何のために使うか | 「来月の販促チラシに載せる文章です」 |\n| **材料** | 判断に必要な情報 | 「商品は◯◯、価格は◯円、客層は50代女性が中心」 |\n| **条件** | 守ってほしい制約 | 「誇大な表現は避ける。200字以内」 |\n| **形式** | 出力のかたち | 「キャッチコピー3案と本文をセットで」 |\n\n### 悪い例と良い例\n\n**悪い例**\n\n> チラシの文章を書いて\n\n**良い例**\n\n> 地域密着の弁当店の新商品チラシに使う文章を書いてください。\n> 商品：国産鶏の唐揚げ弁当（680円）。売りは注文を受けてから揚げること。\n> 客層：近隣オフィスの会社員。昼の時間がない人。\n> 条件：「日本一」など根拠のない表現は使わない。\n> 形式：キャッチコピー3案＋紹介文100字。\n\n悪い例でも何かは出てきます。しかし良い例は**直しがほぼ不要**なものが出てきます。かける手間は1分の差で、戻ってくる品質は大きく違います。\n\n### 型を使いこなす3つのコツ\n\n1. **役割を与える**：「あなたはベテランの採用担当者として」のように立場を指定すると、視点が安定する\n2. **見本を渡す**：「過去のこの文面と同じトーンで」と実物を貼ると、社風に合った文章になる\n3. **分からないことは聞かせる**：「不明な点があれば先に質問してください」と付けると、勝手な思い込みで進むのを防げる\n\n### 完璧な依頼文を目指さない\n\n型はあくまで出発点です。6割の依頼文で出したたたき台に、「ここが違う」と注文をつけて仕上げる方が、完璧な依頼文を練るより速い場面も多くあります。**最初の一球を早く投げる**ことを優先してください。\n\n---"}, {"title": "1-4. 答えを鵜呑みにしない — 検証の習慣", "md": "### この章のゴール\n\nAIの間違いのパターンを知り、業務で安全に使うための確認手順を身につける。\n\n### ハルシネーション：AIの「それらしい嘘」\n\nAIは、知らないことでも「それらしい答え」を作ってしまうことがあります。これをハルシネーション（幻覚）と呼びます。存在しない法律の条文、実在しない統計、間違った計算をもっともらしく出すことがある、ということです。\n\nこれはAIが「嘘をつこうとしている」のではなく、文章の続きを予測する仕組み上の性質です。**なくならない前提で、人間側の確認を仕組みにする**のが正解です。\n\n### 危険度で確認の深さを変える\n\n| 危険度 | 業務の例 | 確認のレベル |\n|---|---|---|\n| 低 | 社内メモの下書き、アイデア出し | ざっと読んで違和感がないか |\n| 中 | 社外向けメール、チラシ、議事録 | 固有名詞・数字・日付を全数チェック |\n| 高 | 契約・法令・税務・安全に関わるもの | 原典や専門家で裏取り。AIは下調べ役に留める |\n\n### 特に確認すべき4つ\n\n1. **数字**：金額、日付、割合。計算はAIの苦手分野のひとつ\n2. **固有名詞**：人名、社名、製品名、地名\n3. **法令・制度**：条文番号、補助金の要件、期限。必ず原典を確認\n4. **「〜だそうです」系の事実**：出典を聞く。「その情報の出典を教えて」と返すだけでよい\n\n### 検証もAIに手伝わせる\n\n矛盾するようですが、確認作業自体もAIに手伝わせられます。\n\n- 「この文章に事実として不確かな箇所があれば列挙して」\n- 「この計算を別の方法で検算して」\n- 「この主張の反対意見を挙げて」\n\nそれでも**最後に責任を持つのは人間**です。社外に出るもの・お金が動くもの・人の安全に関わるものは、必ず人間の目を通してください。\n\n---"}, {"title": "1-5. 会社の情報を守る — 入力してよいもの・悪いもの", "md": "### この章のゴール\n\n情報漏えいの事故を起こさずにAIを使うための線引きを持ち帰る。\n\n### 基本の考え方\n\nAIに入力した内容は、社外のサービスに送信されます。したがって「**社外の取引先にそのまま渡せる情報か？**」が判断の物差しになります。渡せないものは、そのまま入力してはいけません。\n\n### 入力してよいもの・工夫すれば使えるもの・入力しないもの\n\n**そのまま入力してよい**\n\n- 公開情報（自社サイトに載っている内容、公開済みのカタログ）\n- 一般的な相談（「請求書の督促メールの書き方」など、固有情報を含まない質問）\n\n**加工すれば使える（マスキング）**\n\n- 顧客名を「A社」、金額を「約◯百万円」に置き換えた相談\n- 個人名を役割名（「営業担当」「工場長」）に置き換えた文書\n\n**原則入力しない**\n\n- 個人情報（氏名＋連絡先、マイナンバー、健康情報）\n- 取引先との秘密保持契約（NDA）の対象情報\n- パスワード・口座情報\n- 未公表の財務情報・技術情報のうち、漏れたら事業に響くもの\n\n### 会社としての最低限のルール\n\n従業員が各自の判断でバラバラに使うのが一番危険です。最低限、次の3行だけでも社内ルールとして明文化してください。\n\n1. 個人情報とNDA対象情報は入力しない\n2. 社外に出る成果物は必ず人間が確認してから使う\n3. 業務利用は会社が認めたAIサービスに限る\n\nなお、有料の法人向けプランでは入力データがAIの学習に使われない設定が標準になっているなど、契約形態で条件が変わります。導入時に利用規約を確認してください（この点は変わりやすいため、必ず最新の公式情報で）。\n\n---"}, {"title": "第1部のまとめ", "md": "- Claudeは「検索」ではなく「作業者」。下書き・要約・壁打ちから始める\n- 頼み方は**目的・材料・条件・形式**の4点セット。会話で仕上げる\n- ハルシネーションはなくならない前提で、危険度に応じた確認を仕組みにする\n- 情報の線引きは「社外の取引先に渡せるか」。社内ルールを3行でいいので作る\n\n→ 演習は `04_演習と確認クイズ.md` の【第1部 演習】へ"}]}, {"id": "p2", "label": "第2部 実践編", "theme": "毎日の業務で使う", "chapters": [{"title": "2-1. 書く仕事 — メール・案内文・求人票・マニュアル", "md": "### この章のゴール\n\n「書く仕事」を、ゼロから書く作業から「直すだけ」の作業に変える。\n\n### 効果が大きい文書から着手する\n\n書く仕事のAI活用は、**書く頻度が高いもの**か**書くのに気が重いもの**から始めると効果を実感しやすいです。\n\n- 頻度が高い：見積送付の添え状、日程調整、督促、お礼\n- 気が重い：お詫び、値上げのお願い、断りの連絡、求人票\n\n### 実例1：値上げのお願い\n\n> 主要取引先に送る値上げのお願い文を作ってください。\n> 背景：原材料費が2年で2割上がり、自社努力では吸収できなくなった。\n> 内容：来期分から単価を7%引き上げたい。適用は3か月後から。\n> 相手：10年来の取引先。関係は良好。\n> 条件:一方的な通告ではなく、協議をお願いする姿勢で。A4半分程度。\n\n出てきた文面に対して「もう少し踏み込んで、当社のコスト削減努力を1文入れて」のように調整します。**言いにくいことほど、たたき台があると精神的な負担が減る**のがこの使い方の隠れた効能です。\n\n### 実例2：求人票の磨き込み\n\n自社の求人票を貼り付けて、こう頼みます。\n\n> この求人票を、応募者の目線で改善してください。\n> ①応募をためらわせる表現、②具体性が足りない箇所、③他社と差別化できていない箇所を指摘した上で、改善版を作ってください。当社は従業員20名の金属加工業です。\n\n自分で書いた文章の弱点は自分では見えません。**AIは遠慮なく指摘してくれる社外の目**として使えます。\n\n### 実例3：業務マニュアルの整備\n\n頭の中にしかない手順を、話しながら文書にします。\n\n> 私がこれから口頭で説明する作業手順を、新人向けのマニュアルに整理してください。聞き終えたら、抜けていそうな工程や、事故につながりそうな曖昧な箇所を質問してください。\n\n「書けないから残っていない」社内ノウハウは、**話す→AIが書く→人が直す**の流れで文書になります。属人化対策の第一歩です。\n\n### この章の型\n\n- 気が重い文書こそAIでたたき台を作る\n- 自作の文書は「批判役」として読ませて磨く\n- 頭の中の手順は「聞き役」に話して文書化する\n\n---"}, {"title": "2-2. 読む・まとめる仕事 — 議事録・要約・契約書の下読み", "md": "### この章のゴール\n\n「読むのに時間がかかる」「まとめるのが面倒」な仕事を数分に短縮する。\n\n### 実例1：会議メモから議事録へ\n\n会議中の走り書きメモ（箇条書きで乱雑でよい）を貼り付けます。\n\n> このメモから議事録を作ってください。\n> 形式：①決定事項、②持ち帰り担当と期限、③次回に積み残した論点、の3部構成。\n> 条件：メモにないことを推測で補わない。不明な点は【要確認】と印をつける。\n\nポイントは「**推測で補わない**」の一文です。これがないと、AIがメモの隙間をそれらしく埋めてしまうことがあります。\n\n### 実例2：長い資料の要約\n\nPDFやWordファイルを添付して頼みます。\n\n> この30ページの業界レポートを、当社（食品卸・従業員35名）の経営に関係する部分に絞って要約してください。\n> 形式：重要な順に5点。各点に「当社への影響」を1行添えて。\n\nただ縮めるのではなく、**自社の立場に引きつけて要約させる**のがコツです。同じ資料でも「営業部長の視点で」「資金繰りへの影響に絞って」と切り口を変えて何度でも読ませられます。\n\n### 実例3：契約書の下読み\n\n> この業務委託契約書のドラフトを下読みしてください。\n> ①当社（受託側）に不利な条項、②一般的な契約と比べて珍しい条項、③金額・期限・解約に関する条項の要約、を出してください。\n> なお、最終判断は顧問弁護士に確認します。\n\n大事なのは最後の一文の姿勢です。AIの下読みは「専門家に相談すべき箇所の当たりをつける」ためのもので、**専門家の代わりではありません**。ただし、全条項をなんとなく眺めるより、論点を絞って専門家に相談する方が、時間も費用も抑えられます。\n\n### この章の型\n\n- 議事録は「推測で補わない」を必ず付ける\n- 要約は自社の立場・読み手の視点を指定する\n- 契約・法務は「当たりをつける道具」。最終判断は専門家へ\n\n---"}, {"title": "2-3. 数字の仕事 — 集計の下ごしらえと報告資料", "md": "### この章のゴール\n\nExcel作業の前後工程をAIに任せ、数字仕事の時間を減らす。\n\n### AIが得意な数字仕事・任せてはいけない数字仕事\n\n**得意**\n\n- 表の形式変換（縦横の組み替え、単位の統一、表記ゆれの整理）\n- 集計方針の相談（「この売上データ、何で切って見るべき？」）\n- Excelの関数・手順を日本語で教えてもらう\n- 数表から報告文を書く（「この表を役員向けの報告3行に」）\n\n**任せてはいけない（必ず検算する）**\n\n- 桁数の多い計算そのもの\n- 請求・支払など、間違いが直接損害になる計算\n\n計算はExcelにやらせ、**その前後の「段取り」と「言葉にする作業」をAIにやらせる**のが安全な分担です。\n\n### 実例1：ぐちゃぐちゃの表を整える\n\n顧客リストや売上表で、表記がバラバラなことはよくあります（「(株)山田」「山田株式会社」「山田(株)」など）。\n\n> この表の会社名の表記ゆれを統一してください。ルール：法人格は「株式会社」を先頭に統一。判断に迷うものは変更せず【要確認】列に印をつけてください。\n\n### 実例2：数字を報告の言葉にする\n\n月次の売上表を貼り付けて：\n\n> この表から、月例会議で話す3分の報告原稿を作ってください。\n> 含めること：前月比・前年同月比で特に動いた項目とその想定要因。\n> 条件：数字の読み間違いを避けるため、使った数字がどのセルの値か脚注をつけて。\n\n「どの数字を使ったか明示させる」ことで、検算が一気に楽になります。\n\n### 実例3：Excelの先生として使う\n\n> Excelで、シートAの顧客番号をキーにシートBの住所を引っ張ってきたい。手順を、Excelに不慣れな事務員向けに画面操作レベルで説明して。\n\n検索より速く、自社の状況に合わせた説明が返ってきます。エラーが出たら、そのエラーメッセージを貼り付けて続けて質問できます。\n\n### この章の型\n\n- 計算はExcel、段取りと言語化はAI\n- 表記ゆれ整理は「ルール＋迷ったら要確認」で頼む\n- 数字を使わせるときは「出どころを明示させる」\n\n---"}, {"title": "2-4. 調べる仕事 — 市場・競合・制度の下調べ", "md": "### この章のゴール\n\n調べ物の一次スクリーニングをAIに任せつつ、情報の鮮度と出典に責任を持つ。\n\n### 前提:AIの知識には期限がある\n\nClaudeの知識は学習時点までのもので、そのままでは最新の情報を知りません。多くのプランにはWeb検索機能があり、有効にすると最新情報を調べた上で答えます。**「いつ時点の情報か」を常に意識する**のが調べ物の第一原則です。\n\n### 実例1：市場の下調べ\n\n> 高齢者向け配食サービスの市場について、参入を検討するための下調べをしてください。\n> 知りたいこと：市場規模の目安、主要プレイヤー、最近の動向、参入時の壁。\n> 条件：Web検索を使い、各項目に出典URLをつけてください。数字は「いつ時点か」を明記してください。\n\n出典とデータ時点を必ず付けさせる。これだけで「それらしいが根拠のない答え」を大幅に減らせます。\n\n### 実例2：補助金・制度の下調べ\n\n> 従業員30名の製造業が設備投資で使える可能性のある補助金を調べてください。制度名・概要・上限額・締切の一覧表で。各行に出典（公式サイト）のURLを。\n> 注意：制度の要件は複雑なので、最終確認は事務局や支援機関に問い合わせます。当たりをつけるための一覧で構いません。\n\n補助金・税制はハルシネーションの多発地帯です。**AIで候補を絞り、公式サイトと支援機関で確定させる**二段構えを崩さないでください。\n\n### 実例3：競合の整理\n\n> 当社（地域密着の学習塾）の商圏にある競合3社のサイトURLを渡します。料金体系・訴求ポイント・当社との違いを表で整理してください。事実（サイトに書いてあること）と、あなたの解釈は分けて書いてください。\n\n**事実と解釈を分けさせる**のは、調べ物全般で使える指示です。\n\n### この章の型\n\n- 出典URL・データ時点を必ず付けさせる\n- 制度・法令は「AIで絞って公式で確定」の二段構え\n- 事実と解釈を分けて書かせる\n\n---"}, {"title": "2-5. 考える仕事 — 経営判断の壁打ち相手として", "md": "### この章のゴール\n\n一人で抱えがちな判断・企画を、AIとの対話で構造化する。\n\n### 壁打ちとは\n\n答えを出してもらうのではなく、**話し相手になってもらうことで自分の考えを固める**使い方です。経営者・管理職にとって、実はこれが最も価値の大きい使い方だという声が多くあります。社内には話せないこと、まだ生煮えのことを、守秘の線引き（1-5）の範囲で気軽に投げられます。\n\n### 実例1：判断の整理\n\n> 週末営業を始めるか迷っています。壁打ちに付き合ってください。\n> まず、この判断で検討すべき論点を洗い出してください。その後、論点ごとに私に質問して、私の答えを踏まえて整理を進めてください。結論はあなたが決めず、判断材料を揃えるのがゴールです。\n\n「結論を決めるな、材料を揃えろ」と役割を線引きするのがポイントです。\n\n### 実例2：あえて反対させる\n\n> 私は新店舗の出店に前向きです。あなたは反対の立場に立って、この計画の弱点を厳しく指摘してください。遠慮は不要です。\n\nAIは基本的にこちらに同調しやすい性質があります。**意図的に反対役を演じさせる**ことで、社内では出にくい耳の痛い視点を強制的に出せます。\n\n### 実例3：会議の設計\n\n> 来週、来期方針を決める幹部会議があります。90分で結論まで持っていくためのアジェンダを設計してください。参加者は社長・営業部長・工場長・経理責任者。決めたいことは①来期の重点顧客、②設備投資の優先順位。紛糾しそうな論点と、その捌き方の案も添えてください。\n\n### 壁打ちの効能と限界\n\n効能は「考えが速く深くなる」こと。限界は「AIはあなたの会社の空気・人間関係・歴史を知らない」ことです。渡した情報の範囲でしか考えられないので、重要な判断ほど背景を丁寧に渡すか、材料出しまでに留めてください。\n\n### この章の型\n\n- 「結論は出すな、材料を揃えろ」と役割を指定する\n- 同調しやすい性質を踏まえ、あえて反対役をやらせる\n- 会社の文脈は渡した分しか伝わらない。重要判断ほど背景を厚く\n\n---"}, {"title": "第2部のまとめ", "md": "- 書く：気が重い文書のたたき台、自作文書の批判役、口頭ノウハウの文書化\n- 読む：議事録は「推測禁止」、要約は「自社視点」、契約は「専門家への橋渡し」\n- 数字：計算はExcel、段取りと言語化はAI、出どころを明示させる\n- 調べる：出典と時点を必ず付けさせ、制度は公式で確定\n- 考える：壁打ちと反対役。結論は人間が出す\n\n→ 演習は `04_演習と確認クイズ.md` の【第2部 演習】へ"}]}, {"id": "p3", "label": "第3部 応用編", "theme": "仕組みにして会社に根づかせる", "chapters": [{"title": "3-1. 繰り返し業務をテンプレート化する", "md": "### この章のゴール\n\n一度うまくいった頼み方を資産化し、誰がやっても同じ品質が出る状態を作る。\n\n### うまくいった依頼文は会社の資産\n\n第2部の実例のような依頼文は、一度磨き上げれば何度でも使えます。しかし個人のチャット履歴に眠らせておくと、その人しか使えません。**「依頼文テンプレート集」を共有フォルダに置く**——これだけで、AI活用は個人技から会社の道具になります。\n\n### テンプレート集の作り方\n\n1. 業務ごとに1ファイル（例：「議事録作成」「見積添え状」「求人票レビュー」）\n2. 依頼文の本文に、差し替え箇所を【 】で明示する\n3. 「うまく使うコツ」「確認すべき点」を末尾に添える\n\n**テンプレートの例（議事録作成）**\n\n```\nこのメモから議事録を作ってください。\n会議名：【会議名】／日時：【日時】／出席：【出席者】\n形式：①決定事項、②持ち帰り担当と期限、③積み残した論点。\n条件：メモにないことを推測で補わない。不明点は【要確認】と印を。\n\n--- 以下にメモを貼り付け ---\n\n※使うときの注意：出来上がったら決定事項と期限は自分の記憶と突き合わせること\n```\n\n### 「プロジェクト」機能で前提を覚えさせる\n\nClaudeには、よく使う前提情報（会社概要、文体の見本、守ってほしいルール）をまとめて登録しておける「プロジェクト」機能があります（有料プラン）。案件や業務ごとにプロジェクトを作っておくと、毎回同じ説明を繰り返さずに済みます。\n\n登録しておくと効果が大きいもの：\n\n- 会社の基本情報（業種、規模、商品、客層)\n- 文章のトーン見本（過去のメール数通）\n- 禁止事項（使わない表現、出さない情報）\n\n### 改善のサイクルを回す\n\nテンプレートは作って終わりではありません。使った人が「この一文を足したらうまくいった」を書き戻せるようにしておくと、テンプレートが育ちます。月1回、朝礼や会議で「今月のAI活用の発見」を共有する時間を5分とるだけでも、定着の速度が変わります。\n\n---"}, {"title": "3-2. ファイルごと任せる — フォルダ単位の作業と定型レポート", "md": "### この章のゴール\n\n「1回の質問と答え」を超えて、複数ファイル・繰り返し作業を任せる世界を知る。\n\n### チャットの次の段階\n\nここまでの使い方は「ファイルを貼って、答えを受け取る」でした。Claudeには、**パソコンのフォルダを直接読み書きできる作業環境**（デスクトップアプリのフォルダ連携機能や、より高度なClaude Code）があります。これを使うと、次のような仕事の任せ方ができます。\n\n- 「この案件フォルダの中の見積書30件から、金額と納期を一覧表にして」\n- 「毎月の売上CSVから、いつもの形式の月次レポートを作って」\n- 「バラバラの日報ファイルを読んで、今月のクレーム傾向をまとめて」\n\n1回の指示で、AIが**ファイルを開く→読む→整理する→成果物を作る**まで通しでやります。人間は最後の確認だけです。\n\n### どんな業務が向いているか\n\n次の3条件が揃う業務が最有力です。\n\n1. **毎回同じ手順**である（月次・週次の定型作業）\n2. **材料がファイルで揃っている**（Excel、PDF、テキスト）\n3. **間違いが後から確認できる**（元データと突き合わせられる）\n\n例：月次の請求データ突き合わせ、日報の週次サマリー、在庫表と発注書の照合、アンケート自由回答の分類集計。\n\n### 導入のステップ\n\n1. まず1業務だけ選ぶ（上の3条件を満たすもの）\n2. 人間がやった結果とAIがやった結果を**3か月分並走**させて精度を確認\n3. 精度に納得したら、AI実行＋人間チェックの体制に切り替え\n4. 手順書（どう頼むか、何を確認するか）を残す\n\n### 安全のための注意\n\n- 作業用フォルダを分け、原本フォルダを直接触らせない\n- 消えて困るファイルはバックアップを取ってから\n- 個人情報を含むファイル群は、1-5の線引きとプランの契約条件を確認してから\n\n---"}, {"title": "3-3. 社内に広げる — ルール・教育・小さな成功事例", "md": "### この章のゴール\n\n自分ひとりの活用で終わらせず、組織として使える状態への道筋を持つ。\n\n### 広げる順番を間違えない\n\nよくある失敗は「全社員に一斉にアカウントを配って終わり」です。道具だけ配っても、使い方と安心感がなければ定着しません。推奨する順番は次の通りです。\n\n1. **ルールを先に**：1-5の3行ルールを明文化して配る\n2. **推進役を決める**：各部署に1人、質問できる人を置く（詳しい人でなくてよい。一番よく使っている人）\n3. **成功事例を1つ作る**：効果が見えやすい業務（議事録、求人票、報告書）で「◯時間が◯分になった」の実例を作る\n4. **事例を横展開する**：朝礼・回覧で共有し、テンプレート集（3-1）に登録する\n\n### 経営者が示すべきこと\n\n現場は「AIを使ってサボっていると思われないか」を気にします。**「AIで浮いた時間は、お客様対応と改善に使ってほしい。使うことを推奨する」と経営者が明言する**ことが、定着の最大の推進力です。\n\nあわせて、AIの間違いによるミスが起きたときに**個人を責めない**方針も伝えてください。責めると、皆こっそり使って確認を省くようになり、かえって危険です。\n\n### 効果の測り方\n\n導入効果は精密に測ろうとしすぎないのがコツです。次の2つで十分です。\n\n- **時間**：対象業務のビフォーアフター（「議事録：60分→15分」）\n- **声**：月1回、使っている人の実感を集める（「気が重い仕事が減った」も立派な効果）\n\n### 発展の地図\n\n組織への定着が進んだ先には、さらに次の段階があります。この講座の範囲を超えるため概要だけ示します。\n\n- **社内ツール化**：見積計算や日報集計など、自社専用の小さな道具をAIに作らせる\n- **外部サービス連携**：カレンダー・会計ソフト・チャットツールとAIをつなぐ\n- **エージェント活用**：複数の作業を段取りごと任せる使い方の本格化\n\nいずれも「基礎の使い方＋情報の線引き＋確認の習慣」という本講座の土台の上に成り立ちます。土台なしに飛びつかないことが、結局いちばんの近道です。\n\n---"}, {"title": "第3部のまとめ", "md": "- うまくいった依頼文はテンプレート集にして会社の資産にする\n- 定型・ファイル完結・検証可能な業務は、フォルダごと任せる段階へ\n- 広げる順番は「ルール→推進役→成功事例→横展開」\n- 経営者の役割は「使ってよい」と明言し、ミスを個人の責任にしないこと\n\n→ 演習は `04_演習と確認クイズ.md` の【第3部 演習】と【修了テスト】へ"}]}], "exercisesMd": "# 演習と確認クイズ\n\n各部の学習後に取り組んでください。演習は実際にClaudeを操作します。クイズは理解度の確認用で、解答は末尾にあります。\n\n---\n\n## 【第1部 演習】基礎編\n\n### 演習1-A：最初の一仕事\n\n自分の実際の業務からメール1通を選び、Claudeに下書きを頼んでください。出てきた文面に**最低2回**注文をつけて仕上げること（「短く」「もっと丁寧に」など）。\n\n- 提出物：最初の依頼文／最終的な文面／つけた注文の内容\n\n### 演習1-B：4点セットの練り直し\n\n次の雑な依頼を、4点セット（目的・材料・条件・形式）を使って書き直してください。自社の実情を材料に使うこと。\n\n> 「ホームページに載せる会社紹介を書いて」\n\n- 提出物：書き直した依頼文と、Claudeの出力\n\n### 演習1-C：間違い探し\n\nClaudeに「当社の業界の最近の統計を教えて」と**あえて雑に**質問し、返ってきた答えの中から「確認が必要な箇所」を3つ以上マークしてください。その後、出典を尋ねて検証してください。\n\n- 提出物：マークした箇所と、検証の結果\n\n### 演習1-D：情報の線引き\n\n自分の業務でClaudeに相談したい場面を1つ選び、入力予定の内容を「そのまま入力可／マスキングすれば可／入力不可」に仕分けしてください。\n\n---\n\n## 【第1部 確認クイズ】\n\n**Q1.** Claudeの説明として最も適切なものは？\n a) 検索エンジンの一種で、Webから答えを探してくる\n b) 文章での指示に応じて、書く・まとめる・整理するなどの作業を行うAIアシスタント\n c) Excelの代わりに正確な計算を行う計算ソフト\n\n**Q2.** 依頼文の「4点セット」に**含まれない**のは？\n a) 目的　b) 材料　c) 締切　d) 形式\n\n**Q3.** ハルシネーションへの正しい向き合い方は？\n a) 有料プランを使えば発生しないので気にしない\n b) 発生しなくなるまでAIの業務利用は避ける\n c) なくならない前提で、危険度に応じた人間の確認を仕組みにする\n\n**Q4.** AIに入力してよいか判断する物差しとして本講座が示したものは？\n a) 社外の取引先にそのまま渡せる情報か\n b) 社長の許可を得た情報か\n c) 5年以上前の情報か\n\n**Q5.** AIの答えの中で特に検証が必要なもの4つの組み合わせとして正しいのは？\n a) 数字・固有名詞・法令制度・出典が曖昧な事実\n b) 挨拶文・季節の話題・敬語・署名\n c) 文体・改行位置・句読点・漢字の使い分け\n\n---\n\n## 【第2部 演習】実践編\n\n### 演習2-A：気が重い文書\n\n自分の業務で「書くのが気が重い文書」を1つ選び、たたき台を作らせて仕上げてください。仕上げる過程で、危険度（1-4の表）に応じた確認を行うこと。\n\n### 演習2-B：議事録の型\n\n直近の会議メモ（なければ架空のメモで可）から議事録を作らせてください。依頼文に「推測で補わない」「不明点は【要確認】」を必ず含め、それが効いたかを確認してください。\n\n### 演習2-C：自社視点の要約\n\n業界紙の記事や公開レポートを1つ選び、「自社の立場に引きつけた要約」をさせてください。その後、視点を変えて（例：営業視点→資金繰り視点)もう一度要約させ、出力の違いを比べてください。\n\n### 演習2-D：出典つきの下調べ\n\n自社に関係するテーマ（市場・制度・競合いずれか）で、出典URLとデータ時点を必ず付けさせる下調べをしてください。出典のうち1つ以上を実際に開いて、記載と一致するか確認すること。\n\n### 演習2-E：反対役との壁打ち\n\nいま検討中の（または架空の）判断テーマで、AIに反対役をやらせてください。出てきた反論のうち「言われて痛かったもの」を1つ選び、自分の言葉で応答を作ってください。\n\n---\n\n## 【第2部 確認クイズ】\n\n**Q6.** 議事録作成の依頼で「推測で補わない」と指示する主な理由は？\n a) 出力を短くするため\n b) メモにない内容をAIがそれらしく埋めてしまうのを防ぐため\n c) 敬語の間違いを防ぐため\n\n**Q7.** 数字の仕事での安全な役割分担は？\n a) 計算も検算もAIに任せる\n b) 計算はExcel、段取りと言語化はAI、確認は人間\n c) 数字に関わる業務ではAIを一切使わない\n\n**Q8.** 補助金・制度の調べ物で本講座が勧める手順は？\n a) AIの回答をそのまま申請書に使う\n b) AIで候補を絞り、公式サイト・支援機関で確定させる\n c) AIには聞かず、最初から全制度を自力で調べる\n\n**Q9.** 壁打ちでAIに「あえて反対役」をさせる理由は？\n a) AIはこちらに同調しやすい性質があるため、意図的に逆の視点を出させる\n b) AIは常に反対意見しか言えないため\n c) 反対させると回答速度が上がるため\n\n**Q10.** 契約書の下読みにAIを使う際の正しい位置づけは？\n a) 弁護士の代わりとして最終判断させる\n b) 専門家に相談すべき箇所の当たりをつける道具として使う\n c) 契約書にはAIを使ってはならない\n\n---\n\n## 【第3部 演習】応用編\n\n### 演習3-A：テンプレート化\n\n第2部の演習でうまくいった依頼文を1つ選び、差し替え箇所を【 】にしたテンプレートに仕上げてください。「使うときの注意」を必ず添えること。\n\n### 演習3-B：自動化候補の棚卸し\n\n自分の業務から「毎回同じ手順／材料がファイルで揃う／間違いを後から確認できる」の3条件で自動化候補を3つ挙げ、最初に試す1つと理由を書いてください。\n\n### 演習3-C：導入メモ\n\n自社でAI活用を広げるとしたら、という前提で、①3行ルール、②推進役の候補、③最初の成功事例にする業務、を1枚のメモにまとめてください。\n\n---\n\n## 【修了テスト】全10問\n\n**Q11.** AI活用の効果が最も出やすい業務の特徴は？\n a) 会社の存続に関わる重要な意思決定\n b) 頻度が高い、または心理的負担が大きい定型的な文書・整理業務\n c) 高度な専門資格が必要な業務\n\n**Q12.** 「最初の一球を早く投げる」が意味するのは？\n a) 完璧な依頼文を練るより、まずたたき台を出させて会話で仕上げる方が速い場面が多い\n b) 朝一番にAIを使うと精度が上がる\n c) 依頼文は短いほど良い\n\n**Q13.** 社外に出る文書でのAI利用について正しいのは？\n a) AIが作ったものはそのまま出してよい\n b) 固有名詞・数字・日付を人間が確認してから出す\n c) 社外向け文書にはAIを使ってはならない\n\n**Q14.** マスキングの例として適切なのは？\n a) 顧客名を「A社」、担当者名を「営業担当」に置き換えて相談する\n b) 文字の色を白にして貼り付ける\n c) 半分だけ入力する\n\n**Q15.** 「プロジェクト」機能の主な用途は？\n a) 毎回伝えている前提情報（会社概要・文体・ルール）を登録して繰り返しを省く\n b) AIの計算精度を上げる\n c) 料金を安くする\n\n**Q16.** フォルダ単位の作業を任せる業務選びの3条件は？\n a) 新しい・難しい・誰もやりたがらない\n b) 毎回同じ手順・材料がファイルで揃う・間違いが後から確認できる\n c) 経営判断・機密性が高い・急ぎ\n\n**Q17.** フォルダ作業を導入する際の安全策として本講座が挙げたのは？\n a) 原本フォルダを直接触らせず、作業用フォルダとバックアップを用意する\n b) 深夜に実行する\n c) 全ファイルを事前に印刷する\n\n**Q18.** 社内展開の推奨順序は？\n a) 全員にアカウント配布→ルールは問題が起きてから\n b) ルール明文化→推進役→成功事例づくり→横展開\n c) 外部コンサルに全部任せる→報告を待つ\n\n**Q19.** AI起因のミスが起きたときの正しい組織対応は？\n a) 使った個人を処分し、再発防止のためAI利用を禁止する\n b) 個人を責めず、確認手順のどこが抜けたかを仕組みとして直す\n c) 記録を残さず様子を見る\n\n**Q20.** 本講座全体を貫く原則として最も適切なのは？\n a) AIの答えは常に人間より正しい\n b) たたき台と段取りはAI、判断と責任は人間\n c) AIは危険なので限定的にしか使うべきでない\n\n---\n\n## 解答\n\n| 問 | 答 | 問 | 答 |\n|---|---|---|---|\n| Q1 | b | Q11 | b |\n| Q2 | c | Q12 | a |\n| Q3 | c | Q13 | b |\n| Q4 | a | Q14 | a |\n| Q5 | a | Q15 | a |\n| Q6 | b | Q16 | b |\n| Q7 | b | Q17 | a |\n| Q8 | b | Q18 | b |\n| Q9 | a | Q19 | b |\n| Q10 | b | Q20 | b |\n\n**合格の目安**：修了テスト10問中8問以上。間違えた問は該当章に戻って読み直してください。\n", "guideMd": "# Claude仕事術講座 — 中小企業のためのAI実務活用\n\n**講座ガイド（講師・販売者向け）**\n\n---\n\n## この講座について\n\n中小企業の経営者・現場担当者が、AIアシスタント「Claude」を日々の業務の道具として使いこなせるようになるための実務講座です。IT専門知識は前提にしません。「明日の仕事がひとつ楽になる」ことをゴールに、実際の業務場面に即した例と演習で構成しています。\n\n本講座は52works（啓一郎氏）のオリジナル教材として、構成・本文・例題・演習・クイズのすべてを独自に書き下ろしたものです。\n\n## 対象受講者\n\n- 中小企業の経営者・役員（自社へのAI導入を判断する立場）\n- 総務・経理・営業・製造などの現場担当者（日々の実務で使う立場）\n- ITに詳しくなくてよい。パソコンで日常業務ができれば十分\n\n## 構成\n\n全3部・13章。1部あたり90〜120分の研修、または自習で1部あたり2〜3時間を想定。\n\n| 部 | テーマ | 章 |\n|---|---|---|\n| 第1部 基礎編 | AIを仕事の道具にする | 1-1〜1-5 |\n| 第2部 実践編 | 毎日の業務で使う | 2-1〜2-5 |\n| 第3部 応用編 | 仕組みにして会社に根づかせる | 3-1〜3-3 |\n\n各部末に演習、講座末に修了テストがあります（`04_演習と確認クイズ.md`）。\n\ const LS_KEY = "cwt-progress-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch(e) { state = {}; }
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function md(text){ return (window.marked ? marked.parse(text) : "<pre>"+text.replace(/</g,"&lt;")+"</pre>"); }
function chapKey(pi,ci){ return "c-"+pi+"-"+ci; }
function partProgress(pi){
  const total = DATA.parts[pi].chapters.length;
  let done = 0;
  DATA.parts[pi].chapters.forEach((_,ci)=>{ if(state[chapKey(pi,ci)]) done++; });
  return {done,total,pct: total? Math.round(done/total*100):0};
}
let view = {type:"home"};

function renderNav(){
  const nav = document.getElementById("nav");
  let h = '<div class="brand">Claude仕事術講座</div><div class="brand-sub">中小企業のためのAI実務活用</div>';
  h += navBtn("ホーム", view.type==="home", `go({type:'home'})`);
  DATA.parts.forEach((p,pi)=>{
    const pr = partProgress(pi);
    h += `<div class="nav-group"><div class="nav-part">${p.label} — ${p.theme}</div>`;
    h += `<div class="progress-mini">完了 ${pr.done}/${pr.total}</div>`;
    p.chapters.forEach((c,ci)=>{
      const active = view.type==="chapter" && view.pi===pi && view.ci===ci;
      const done = state[chapKey(pi,ci)] ? '<span class="done">✓</span>' : "";
      h += navBtn(done + c.title, active, `go({type:'chapter',pi:${pi},ci:${ci}})`);
    });
    h += "</div>";
  });
  h += '<div class="nav-group"><div class="nav-part">確認と演習</div>';
  h += navBtn("演習一覧", view.type==="ex", `go({type:'ex'})`);
  h += navBtn("確認クイズ（第1部）", view.type==="quiz"&&view.set==="q1", `go({type:'quiz',set:'q1'})`);
  h += navBtn("確認クイズ（第2部）", view.type==="quiz"&&view.set==="q2", `go({type:'quiz',set:'q2'})`);
  h += navBtn("修了テスト", view.type==="quiz"&&view.set==="final", `go({type:'quiz',set:'final'})`);
  h += "</div>";
  h += '<div class="nav-group"><div class="nav-part">資料</div>';
  h += navBtn("講座ガイド", view.type==="guide", `go({type:'guide'})`);
  h += "</div>";
  nav.innerHTML = h;
}
function navBtn(label, active, onclick){
  return `<button class="nav-item${active?" active":""}" onclick="${onclick}">${label}</button>`;
}
function go(v){ view = v; render(); window.scrollTo(0,0); }

function render(){
  renderNav();
  const main = document.getElementById("main");
  if(view.type==="home"){ main.innerHTML = renderHome(); }
  else if(view.type==="chapter"){ main.innerHTML = renderChapter(view.pi, view.ci); }
  else if(view.type==="ex"){ main.innerHTML = `<div class="crumb">ホーム / 演習</div><div class="content">${md(DATA.exercisesMd.split("## 【第1部 確認クイズ】")[0])}</div><p style="color:var(--muted);font-size:13px">※確認クイズはサイドメニューから対話形式で受けられます。第2部・第3部の演習は下記に続きます。</p><div class="content">${md(extractExercises())}</div>`; }
  else if(view.type==="quiz"){ main.innerHTML = renderQuiz(view.set); attachQuiz(view.set); }
  else if(view.type==="guide"){ main.innerHTML = `<div class="crumb">ホーム / 講座ガイド</div><div class="content">${md(DATA.guideMd)}</div>`; }
}
function extractExercises(){
  const src = DATA.exercisesMd;
  const p2 = src.split("## 【第2部 演習】")[1] || "";
  const p2ex = p2.split("## 【第2部 確認クイズ】")[0] || "";
  const p3 = src.split("## 【第3部 演習】")[1] || "";
  const p3ex = p3.split("## 【修了テスト】")[0] || "";
  return "## 【第2部 演習】" + p2ex + "\n## 【第3部 演習】" + p3ex;
}
function renderHome(){
  let h = `<div class="home-hero"><h1>Claude仕事術講座</h1><p>中小企業のためのAI実務活用 — 全3部・13章。順に進めても、自分の仕事に近い章から読んでも構いません。</p></div><div class="card-grid">`;
  DATA.parts.forEach((p,pi)=>{
    const pr = partProgress(pi);
    h += `<div class="card" onclick="go({type:'chapter',pi:${pi},ci:0})"><h3>${p.label}</h3><p>${p.theme}（全${pr.total}章）</p><div class="bar"><div style="width:${pr.pct}%"></div></div><div class="bar-label">完了 ${pr.pct}%</div></div>`;
  });
  h += `<div class="card" onclick="go({type:'ex'})"><h3>演習</h3><p>実際にClaudeを操作して身につける実務演習</p></div>`;
  h += `<div class="card" onclick="go({type:'quiz',set:'final'})"><h3>修了テスト</h3><p>全10問。8問以上で合格</p></div>`;
  h += `</div>`;
  h += `<p style="margin-top:24px"><button class="btn secondary" onclick="if(confirm('学習の進捗をリセットしますか？')){state={};save();render();}">進捗をリセット</button></p>`;
  return h;
}
function renderChapter(pi,ci){
  const p = DATA.parts[pi], c = p.chapters[ci];
  const done = !!state[chapKey(pi,ci)];
  const prev = ci>0 ? `<button class="btn secondary" onclick="go({type:'chapter',pi:${pi},ci:${ci-1}})">← 前の章</button>` : "";
  let next = "";
  if(ci < p.chapters.length-1) next = `<button class="btn" onclick="go({type:'chapter',pi:${pi},ci:${ci+1}})">次の章 →</button>`;
  else if(pi < DATA.parts.length-1) next = `<button class="btn" onclick="go({type:'chapter',pi:${pi+1},ci:0})">${DATA.parts[pi+1].label}へ →</button>`;
  else next = `<button class="btn" onclick="go({type:'quiz',set:'final'})">修了テストへ →</button>`;
  return `<div class="crumb">ホーム / ${p.label} <span class="pill">${p.theme}</span></div>
  <div class="content"><h1>${c.title}</h1>${md(c.md)}</div>
  <div class="complete-bar">
    <label style="font-size:14px;cursor:pointer"><input type="checkbox" ${done?"checked":""} onchange="state['${chapKey(pi,ci)}']=this.checked;save();renderNav();"> この章を完了にする</label>
    <span>${prev} ${next}</span>
  </div>`;
}
function quizSet(set){
  if(set==="q1") return DATA.quiz.filter(q=>q.n<=5);
  if(set==="q2") return DATA.quiz.filter(q=>q.n>=6 && q.n<=10);
  return DATA.quiz.filter(q=>q.n>=11);
}
const quizTitles = {q1:"確認クイズ（第1部 基礎編）", q2:"確認クイズ（第2部 実践編）", final:"修了テスト"};
let quizSel = {};
function renderQuiz(set){
  const qs = quizSet(set);
  quizSel = {};
  let h = `<div class="crumb">ホーム / ${quizTitles[set]}</div><div class="content"><h1>${quizTitles[set]}</h1><p>${set==="final" ? "全"+qs.length+"問。8問以上の正解で合格です。" : "各問、最も適切なものを選んでください。"}</p></div><div id="quiz-area">`;
  qs.forEach((q,qi)=>{
    h += `<div class="quiz-q" id="qq-${qi}"><h4>Q${q.n}. ${q.q}</h4>`;
    q.opts.forEach((o,oi)=>{
      h += `<div class="quiz-opt" data-q="${qi}" data-o="${oi}">${"abcd"[oi]}） ${o}</div>`;
    });
    h += `</div>`;
  });
  h += `</div><div id="quiz-result"></div><button class="btn" id="quiz-grade">採点する</button>`;
  return h;
}
function attachQuiz(set){
  const qs = quizSet(set);
  document.querySelectorAll(".quiz-opt").forEach(el=>{
    el.onclick = ()=>{
      const qi = el.dataset.q;
      quizSel[qi] = parseInt(el.dataset.o);
      document.querySelectorAll(`.quiz-opt[data-q="${qi}"]`).forEach(x=>x.classList.remove("sel"));
      el.classList.add("sel");
    };
  });
  document.getElementById("quiz-grade").onclick = ()=>{
    let correct = 0;
    qs.forEach((q,qi)=>{
      document.querySelectorAll(`.quiz-opt[data-q="${qi}"]`).forEach(x=>{
        const oi = parseInt(x.dataset.o);
        x.classList.remove("correct","wrong");
        if(oi === q.ans) x.classList.add("correct");
        else if(quizSel[qi] === oi) x.classList.add("wrong");
      });
      if(quizSel[qi] === q.ans) correct++;
    });
    const res = document.getElementById("quiz-result");
    let msg = `${qs.length}問中 ${correct}問正解`;
    if(set==="final") msg += correct>=8 ? " — 合格です 🎉" : " — あと少し。間違えた章を読み直してもう一度";
    res.innerHTML = `<div class="quiz-result">${msg}</div>`;
    res.scrollIntoView({behavior:"smooth"});
  };
}
render();
</script>
</body>
</html>
